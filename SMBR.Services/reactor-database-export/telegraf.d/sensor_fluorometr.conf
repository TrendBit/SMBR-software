[[inputs.http]]
    urls = ["http://localhost:8089/sensor/fluorometer/ojip/read_last"]
    interval = "30s"
    method = "GET"
    name_override = "sensor/fluorometer/ojip"
    data_format = "json_v2"

    [[inputs.http.json_v2]]
        timestamp_path = "timestamp"
        timestamp_format = "2006-01-02T15:04:05"

        [[inputs.http.json_v2.tag]]
            path = "measurement_id"
        [[inputs.http.json_v2.tag]]
            path = "detector_gain"
        [[inputs.http.json_v2.tag]]
            path = "saturated"
        [[inputs.http.json_v2.tag]]
            path = "emitor_intensity"
        [[inputs.http.json_v2.tag]]
            path = "timebase"

    [[inputs.http.json_v2.object]]
        path = "samples"

        tags = ["time_ms"]

        fields = { raw_value = "int", relative_value = "float", absolute_value = "float" }

[[processors.starlark]]
    namepass = ["sensor/fluorometer/ojip"]
    source = '''
def apply(metric):
    if "time_ms" in metric.tags:
        offset_ms = float(metric.tags["time_ms"])
        metric.time += int(offset_ms * 1000000)
        metric.tags.pop("time_ms")
    return metric
'''

[[inputs.http]]
    urls = ["http://localhost:8089/sensor/fluorometer/emitor/temperature"]
    interval = "5s"
    method = "GET"
    data_format = "json"
    json_string_fields = ["temperature"]
    name_override = "sensor/fluorometer/emitor_temperature"

[[inputs.http]]
    urls = ["http://localhost:8089/sensor/fluorometer/detector/temperature"]
    interval = "5s"
    method = "GET"
    data_format = "json"
    json_string_fields = ["temperature"]
    name_override = "sensor/fluorometer/detector_temperature"
